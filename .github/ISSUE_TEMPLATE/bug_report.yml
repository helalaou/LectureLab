name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See error …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: e.g. Safari 19 on iPhone 16, Chrome 141 on macOS
  - type: textarea
    id: logs
    attributes:
      label: Console or function logs
      render: text
